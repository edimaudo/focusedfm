{% extends "base.html" %}

{% block content %}
<div class="player-card">
    <section class="music-player">
        <select id="genre-selector" class="genre-select" aria-label="Select Genre">
            {% for genre in playlists.keys() %}
                <option value="{{ genre }}">{{ genre }}</option>
            {% endfor %}
        </select>

        <div class="now-playing">
            <h2 id="current-track-name">Select a track</h2>
            <p id="current-genre-display">Genre: Rain</p>
        </div>

        <div class="controls">
            <button id="prev-btn" aria-label="Previous Track">⏮</button>
            <button id="play-btn" aria-label="Play or Pause">▶</button>
            <button id="next-btn" aria-label="Next Track">⏭</button>
        </div>

        <div class="volume-container">
            <label for="volume-slider">Volume</label>
            <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="0.5">
        </div>

        <ul id="track-list" class="track-list">
            </ul>
    </section>
</div>

<script>
    // Pass Python data to JS
    const playlists = {{ playlists | tojson }};
</script>
{% endblock %}
