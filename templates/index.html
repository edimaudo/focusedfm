{% extends "base.html" %}

{% block content %}
<div class="minimal-player-container">
    <p class="tagline">beats for work, productivity, flow</p>

    <div class="main-controls">
        <button id="prev-btn" class="nav-btn" aria-label="Previous Track">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        
        <button id="play-btn" class="play-circle" aria-label="Play or Pause">
            <div id="play-icon" class="play-triangle"></div>
        </button>

        <button id="next-btn" class="nav-btn" aria-label="Next Track">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6h2v12h-2z"/></svg>
        </button>
    </div>

    <div class="player-footer">
        <div class="footer-item dropdown">
            <button class="footer-link" id="channels-btn">channels</button>
            <div id="genre-menu" class="genre-content">
                {% for genre in playlists.keys() %}
                <button onclick="selectGenre('{{ genre }}')">{{ genre }}</button>
                {% endfor %}
            </div>
        </div>

        <div class="footer-item volume-group">
            <span class="vol-icon">🔈</span>
            <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="0.5" aria-label="Volume Control">
            <span class="vol-icon">🔊</span>
        </div>

        <div class="footer-item">
            <span class="footer-link" id="track-info">track info</span>
        </div>
    </div>

    <div class="timer-mini">
        <span id="timer-display">25:00</span>
        <button id="timer-toggle">start timer</button>
    </div>
</div>

<script>const playlists = {{ playlists | tojson }};</script>
{% endblock %}
