<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}focusedfm{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;600&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  {% block head %}{% endblock %}
</head>
<body>

  <header class="site-header" role="banner">
    <div class="brand" aria-label="focusedfm">
      <span class="brand-dot" aria-hidden="true"></span>
      <span class="brand-name">focused<em>fm</em></span>
    </div>

    <div class="header-right">
      <div class="theme-toggle" role="group" aria-label="Theme">
        <span class="theme-label" aria-hidden="true">light</span>
        <button
          class="toggle-track"
          id="themeToggle"
          role="switch"
          aria-checked="false"
          aria-label="Toggle dark theme"
        ><span class="toggle-thumb"></span></button>
        <span class="theme-label" aria-hidden="true">dark</span>
      </div>
    </div>
  </header>

  <main id="main-content" role="main">
    {% block content %}{% endblock %}
  </main>

  {% block data %}{% endblock %}
  <script src="{{ url_for('static', filename='js/player.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
