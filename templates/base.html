<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}focusedfm{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  {% block head %}{% endblock %}
</head>
<body>

  <div class="noise-overlay" aria-hidden="true"></div>

  <header class="site-header" role="banner">
    <div class="header-inner">
      <div class="brand" aria-label="focusedfm home">
        <span class="brand-dot" aria-hidden="true"></span>
        <span class="brand-name">focused<em>fm</em></span>
      </div>

      <div class="header-controls">
        <div class="theme-toggle" role="group" aria-label="Theme selection">
          <span class="theme-label" aria-hidden="true">☀</span>
          <button
            class="toggle-track"
            id="themeToggle"
            role="switch"
            aria-checked="true"
            aria-label="Toggle light or dark theme"
          >
            <span class="toggle-thumb"></span>
          </button>
          <span class="theme-label" aria-hidden="true">☾</span>
        </div>
      </div>
    </div>
  </header>

  <main id="main-content" role="main">
    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='js/player.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
